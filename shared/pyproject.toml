[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rddc-screen-common"
version = "0.1.0"
description = "Shared pattern detectors and structural QC reports for RDDC screens"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rddc-screen-qc = "rddc_screen_common.qc:main"
