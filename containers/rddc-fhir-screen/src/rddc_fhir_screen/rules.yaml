# Identifier screen rules for FHIR R4 (RDDC's QC and de-identification inventory, section 4.2).
#
# Actions, and the data property each one reports to the orchestrator:
#   stop       direct identifier                     -> direct_identifiers (quarantines the batch)
#   provider   clinician or site identity            -> per --provider-policy: stop, or review
#   dates      full date (inventory for release)     -> dates
#   zip_codes  ZIP code (inventory for release)      -> zip_codes
#   free_text  prose to de-identify (deid_fhir)      -> free_text
#   review     a finding for a curator, no property
#
# Element rules are lists of FHIRPath (R4) expressions. An expression that returns a
# non-empty value counts once for the resource it was evaluated on. An expression
# that starts with a resource type (Patient.name) applies to that type only; one that does
# not (note.text) applies to every resource. Choice elements need ofType():
# value.ofType(string), not valueString. Quote FHIRPath keywords used as element names with
# backticks: text.`div`. tests/test_screen.py checks every expression against the R4 model,
# because a misspelt path matches nothing rather than failing.
#
# The checks below `elements` apply to every value in a resource and are not FHIRPath.
version: 0.1.0

# Resources of these types are not screened: definitions (R4 conformance and terminology
# resources, and Questionnaire) describe data and hold none. findings.tsv counts them under
# rule definition_resource, action skipped. Publisher contact details in them are not
# reported.
skip_resources: [CapabilityStatement, StructureDefinition, ImplementationGuide, SearchParameter,
                 MessageDefinition, OperationDefinition, CompartmentDefinition, StructureMap,
                 GraphDefinition, ExampleScenario, CodeSystem, ValueSet, ConceptMap, NamingSystem,
                 TerminologyCapabilities, Questionnaire]

# Random identifiers carry nothing about a person: a UUID resource id or identifier value
# (optionally urn:uuid:) passes rules marked `opaque`, reported with action opaque. Any
# other value must be a pseudonym the source confirmed (assets/sources/README.md).
opaque_ids: '(urn:uuid:)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'

elements:
- id: patient_direct
  action: stop
  paths:
  - Patient.name
  - Patient.telecom
  - Patient.address.line
  - Patient.address.city
  - Patient.address.district
  - Patient.address.text
  - Patient.address.extension
  - Patient.identifier
  - Patient.photo
  - Patient.contact
  - Patient.link
- id: related_person_direct
  action: stop
  paths:
  - RelatedPerson.name
  - RelatedPerson.telecom
  - RelatedPerson.address.line
  - RelatedPerson.address.city
  - RelatedPerson.address.district
  - RelatedPerson.address.text
  - RelatedPerson.identifier
  - RelatedPerson.photo
  - FamilyMemberHistory.name
  - FamilyMemberHistory.identifier
- id: device_identifiers
  action: stop
  paths:
  - Device.udiCarrier
  - Device.serialNumber
  - Device.distinctIdentifier
- id: provider_identity
  action: provider
  paths:
  - Practitioner.name
  - Practitioner.identifier
  - Practitioner.telecom
  - Practitioner.address
  - Practitioner.photo
  - PractitionerRole.identifier
  - PractitionerRole.telecom
  - Organization.name
  - Organization.alias
  - Organization.identifier
  - Organization.telecom
  - Organization.address
  - Location.name
  - Location.alias
  - Location.identifier
  - Location.telecom
  - Location.address
  - Location.position
- id: person_resource_ids
  # A source that uses the MRN as the resource id puts it in every reference as well.
  action: stop
  opaque: true
  paths:
  - Patient.id
  - RelatedPerson.id
  - Person.id
- id: provider_resource_ids
  action: provider
  opaque: true
  paths:
  - Practitioner.id
  - PractitionerRole.id
- id: other_identifiers
  # Visit, accession, order, claim, plan and device numbers on any other resource. The
  # resources with their own identifier rules are excepted, and so are products, whose
  # identifiers are product codes (NDC).
  action: stop
  opaque: true
  except: [Patient, RelatedPerson, FamilyMemberHistory, Practitioner, PractitionerRole, Organization,
           Location, Medication, Substance]
  paths:
  - identifier
- id: narrative
  action: free_text
  paths:
  - text.`div`
- id: free_text_elements
  action: free_text
  paths:
  - note.text
  - value.ofType(string)
  - component.value.ofType(string)
  - interpretation.text
  - conclusion
  - code.text
  - reaction.description
  - dosageInstruction.text
  - dosageInstruction.patientInstruction
  - QuestionnaireResponse.repeat(item).answer.value.ofType(string)
  - description
  - comment
- id: attachments
  # Whole documents and images inside a resource: extracted and routed by content type
  # (inventory 4.2 and gap 10), not screened here. Attachments in extensions are reported
  # as unknown extensions.
  action: review
  paths:
  - DocumentReference.content.attachment.data
  - DocumentReference.content.attachment.url
  - DiagnosticReport.presentedForm
  - Media.content
  - Binary.data
  - Communication.payload.content.ofType(Attachment)
  - CommunicationRequest.payload.content.ofType(Attachment)
  - QuestionnaireResponse.repeat(item).answer.value.ofType(Attachment)

# Keys matched anywhere in a resource.
keys:
  postalCode: zip_codes

# Reference.display carries names even when the target resource is clean. The action
# depends on the type the reference points to (Patient/123, or Practitioner?identifier=...).
reference_display:
  stop: [Patient, RelatedPerson, Person]
  provider: [Practitioner, PractitionerRole, Organization, Location]
  other: free_text
# A conditional reference to a clinician or site embeds its identifier (an NPI).
reference_provider_identifier: provider

# Extensions by URL. An extension whose URL is not listed here and whose value is a string,
# name, address, contact point, identifier or attachment is reported for review (unknown
# extension).
extensions:
  http://hl7.org/fhir/StructureDefinition/patient-mothersMaidenName: stop
  http://hl7.org/fhir/StructureDefinition/patient-birthPlace: stop
  http://hl7.org/fhir/StructureDefinition/geolocation: stop
  http://hl7.org/fhir/us/core/StructureDefinition/us-core-race: ok
  http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity: ok
  http://hl7.org/fhir/us/core/StructureDefinition/us-core-birthsex: ok
  ombCategory: ok
  detailed: ok
  text: ok

# Full dates (YYYY-MM-DD, with or without a time) anywhere but under meta.
dates:
  action: dates
  skip_under: [meta]

# Pattern detectors run on every string value, except under these keys (codes, systems and
# URLs, which are not free values) and on elements of these R4 types. A canonical is the
# URL of a definition (a profile, value set or questionnaire), not an identifier. URLs in
# other values are still checked; attachment URLs are reported by the attachments rule.
patterns:
  action: stop
  skip_keys: [system, url, profile, reference, fullUrl, code, version, resourceType]
  skip_types: [canonical]
  # URLs to these hosts are not identifiers.
  url_hosts: [www.w3.org, hl7.org, terminology.hl7.org, loinc.org, snomed.info, unitsofmeasure.org,
              www.nlm.nih.gov, github.com/synthetichealth]
